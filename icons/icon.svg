<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0055D4" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Outer subtle radar circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.35" />

  <!-- Navigation Arrow / Location Dot combo -->
  <g filter="url(#dropShadow)">
    <path d="M256 120 L350 360 L256 305 L162 360 Z" fill="#FFFFFF" />
    <circle cx="256" cy="245" r="16" fill="#007AFF" />
  </g>
</svg>
