<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Wake</title>

  <!-- PWA & Mobile Web App Meta -->
  <meta name="theme-color" content="#007AFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wake" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png" />
  <link rel="icon" type="image/webp" href="icons/icon.webp" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="shortcut icon" href="favicon.ico" />

  <!-- MapLibre GL CSS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />

  <style>
    :root {
      --primary: #007AFF;
      --primary-dark: #0056b3;
      --danger: #FF3B30;
      --warning: #FF9500;
      --bg-glass: rgba(255, 255, 255, 0.94);
      --bg-glass-dark: rgba(28, 28, 30, 0.88);
      --text-dark: #1c1c1e;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #e5e3df;
    }

    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* MapLibre Attribution override */
    .maplibregl-ctrl-attrib {
      font-size: 9px !important;
      background: rgba(255, 255, 255, 0.6) !important;
      backdrop-filter: blur(5px);
      padding: 2px 6px !important;
      border-top-left-radius: 6px;
      margin: 0 !important;
    }

    /* ==========================================================
       USER LOCATION MARKER & ROTATING VISION BEAM
       ========================================================== */
    .user-marker-container {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .user-beam {
      position: absolute;
      width: 160px;
      height: 160px;
      top: 0;
      left: 0;
      transform-origin: 80px 80px;
      transition: transform 0.1s linear;
      pointer-events: none;
      display: none;
    }

    .user-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
      background-color: #007AFF;
      border: 3.5px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }

    /* Destination Marker */
    .dest-dot {
      width: 20px;
      height: 20px;
      background-color: #1C1C1E;
      border: 3.5px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
      position: relative;
    }
    .dest-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      background-color: #FF3B30;
      border-radius: 50%;
    }

    /* Radar Map Marker (Shown ONLY on active route) */
    .radar-marker-pin {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .radar-badge {
      background: #1C1C1E;
      color: #FFFFFF;
      border: 2px solid #FF9500;
      border-radius: 8px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .radar-badge svg {
      width: 12px;
      height: 12px;
      fill: #FF9500;
    }

    /* ==========================================================
       TOP SEARCH BAR & POI MODE SELECTOR
       ========================================================== */
    .top-container {
      position: absolute;
      top: calc(var(--safe-top) + 12px);
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .search-card {
      pointer-events: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 18px;
      box-shadow: var(--shadow);
      border: 0.5px solid rgba(255, 255, 255, 0.7);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .search-input-row {
      display: flex;
      align-items: center;
      padding: 6px 12px;
      gap: 8px;
    }

    .search-icon {
      color: #8E8E93;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .search-input-row input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15px;
      color: var(--text-dark);
      padding: 6px 4px;
      outline: none;
      font-family: inherit;
    }

    .search-input-row input::placeholder {
      color: #8E8E93;
    }

    /* Route HUD Info Banner */
    .route-hud {
      pointer-events: auto;
      background: var(--bg-glass-dark);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      padding: 12px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      color: #FFFFFF;
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      animation: slideDown 0.3s ease;
    }

    .route-hud.active {
      display: flex;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hud-metrics {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hud-primary {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .hud-time {
      color: #30D158;
    }

    .hud-dist {
      font-size: 14px;
      font-weight: 500;
      color: #EBEBF599;
    }

    .hud-eta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #EBEBF599;
    }

    .hud-traffic-badge {
      display: none;
      background: rgba(255, 149, 0, 0.25);
      color: #FF9F0A;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 6px;
      border: 0.5px solid rgba(255, 149, 0, 0.5);
    }

    .hud-traffic-badge.active {
      display: inline-flex;
      align-items: center;
    }

    /* iOS Segmented Transport Switch */
    .transport-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 3px;
      gap: 3px;
      align-items: center;
    }

    .transport-btn {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      width: 36px;
      height: 32px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    .transport-btn:active {
      transform: scale(0.92);
    }

    .transport-btn.active {
      background: #FFFFFF;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .transport-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .hud-radar-alert {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #FF9F0A;
      margin-top: 2px;
    }

    .hud-radar-alert.active {
      display: flex;
    }

    .btn-clear-route {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #FFFFFF;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-clear-route:active {
      background: rgba(255, 255, 255, 0.3);
    }

    /* ==========================================================
       DROPDOWN: RESULTS & RECENT HISTORY
       ========================================================== */
    .dropdown-container {
      pointer-events: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 16px;
      box-shadow: var(--shadow);
      max-height: 280px;
      overflow-y: auto;
      display: none;
      border: 0.5px solid rgba(255, 255, 255, 0.7);
    }

    .dropdown-container.active {
      display: block;
    }

    .dropdown-header {
      padding: 10px 14px 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8E8E93;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.05);
    }

    .btn-clear-history {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .list-item {
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text-dark);
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item:active {
      background: rgba(0, 122, 255, 0.08);
    }

    .list-item-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .list-item-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-item-subtitle {
      font-size: 12px;
      color: #8E8E93;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-item-meta {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
    }

    .list-item-icon {
      font-size: 16px;
      width: 24px;
      text-align: center;
      color: #8E8E93;
    }

    /* ==========================================================
       BOTTOM LEFT: SPEEDOMETER & SPEED LIMIT SIGN
       ========================================================== */
    .bottom-left-hud {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 24px);
      left: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .speed-limit-sign {
      width: 44px;
      height: 44px;
      background: #FFFFFF;
      border: 4.5px solid #FF3B30;
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      overflow: hidden;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .speed-limit-val {
      font-size: 16px;
      font-weight: 900;
      color: #1C1C1E;
      line-height: 1;
      text-align: center;
      margin: 0;
      padding: 0;
      letter-spacing: -0.5px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    @keyframes blinkOverspeed {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.8);
        background-color: #FFFFFF;
      }
      50% {
        transform: scale(1.22);
        box-shadow: 0 0 20px 8px rgba(255, 59, 48, 0.95);
        background-color: #FFD4D2;
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.8);
        background-color: #FFFFFF;
      }
    }

    .speed-limit-sign.overspeed {
      animation: blinkOverspeed 0.6s infinite ease-in-out;
      border-color: #FF1A0D;
    }

    .speedometer-box {
      background: var(--bg-glass-dark);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 0.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      padding: 7px 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      color: #FFFFFF;
    }

    .speed-val {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
    }

    .speed-unit {
      font-size: 9px;
      font-weight: 700;
      color: #8E8E93;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    /* ==========================================================
       BOTTOM RIGHT: 3D PERSPECTIVE & RECENTER BUTTONS
       ========================================================== */
    .fab-group {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 24px);
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fab {
      width: 48px;
      height: 48px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 50%;
      box-shadow: var(--shadow);
      border: 0.5px solid rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1C1C1E;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
      font-weight: 800;
      font-size: 14px;
    }

    .fab:active {
      transform: scale(0.92);
    }

    .fab.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    .fab svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Toast Notification */
    .toast {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 90px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(28, 28, 30, 0.92);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Fullscreen WebGL 3D Map -->
  <div id="map"></div>

  <!-- Top Search & HUD Area -->
  <div class="top-container">
    <div class="search-card">
      <div class="search-input-row">
        <div class="search-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <input type="text" id="searchInput" placeholder="Adresse ou lieu (boulangerie, cinéma...)" autocomplete="off" />
      </div>
    </div>

    <!-- Dropdown: Results & Recent History -->
    <div class="dropdown-container" id="dropdownContainer"></div>

    <!-- Route Status HUD -->
    <div class="route-hud" id="routeHud">
      <!-- Left Metrics & Traffic info -->
      <div class="hud-metrics">
        <div class="hud-primary">
          <span class="hud-time" id="hudTime">-- min</span>
          <span class="hud-dist" id="hudDist">-- km</span>
        </div>
        <div class="hud-eta-row">
          <span class="hud-eta" id="hudEta">Arrivée --:--</span>
          <span class="hud-traffic-badge" id="hudTrafficBadge">⚡ Heure de pointe +25%</span>
        </div>
        <div class="hud-radar-alert" id="hudRadarAlert">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
          </svg>
          <span id="hudRadarText">Radar à 400m</span>
        </div>
      </div>

      <!-- Middle: iOS Transport Switch (Voiture, Vélo, Piéton) -->
      <div class="transport-switch" id="transportSwitch">
        <button class="transport-btn active" data-mode="driving" title="Voiture">
          <svg viewBox="0 0 24 24">
            <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
          </svg>
        </button>
        <button class="transport-btn" data-mode="cycling" title="Vélo">
          <svg viewBox="0 0 24 24">
            <path d="M15.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM5 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5zm5.8-10l2.4-2.4.8.8c1.3 1.3 3 2.1 5 2.1V9c-1.5 0-2.9-.6-3.9-1.6l-1.8-1.8c-.4-.4-.9-.6-1.5-.6-.6 0-1.1.2-1.5.6L7.4 8.4c-.4.4-.6.9-.6 1.6 0 .6.2 1.1.6 1.5l3.4 3.5V20h2v-5.9l-2-2.1zM19 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z"/>
          </svg>
        </button>
        <button class="transport-btn" data-mode="walking" title="Piéton">
          <svg viewBox="0 0 24 24">
            <path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"/>
          </svg>
        </button>
      </div>

      <!-- Right: Close Route -->
      <button class="btn-clear-route" id="btnClearRoute" title="Annuler l'itinéraire">✕</button>
    </div>
  </div>

  <!-- Bottom-Left Speedometer & Speed Limit Sign -->
  <div class="bottom-left-hud">
    <div class="speed-limit-sign" id="speedLimitSign">
      <span class="speed-limit-val" id="speedLimitVal">50</span>
    </div>
    <div class="speedometer-box">
      <div class="speed-val" id="speedVal">0</div>
      <div class="speed-unit">KM/H</div>
    </div>
  </div>

  <!-- Bottom-Right Floating Controls (3D & Recenter) -->
  <div class="fab-group">
    <!-- 3D / 2D Perspective Toggle -->
    <button class="fab" id="btn3D" title="Vue perspective 3D">
      <span id="label3D">3D</span>
    </button>

    <!-- Recenter / Auto-follow -->
    <button class="fab active" id="btnRecenter" title="Recentrer">
      <svg viewBox="0 0 24 24">
        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
      </svg>
    </button>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <!-- MapLibre GL JS (WebGL + 3D Buildings) -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <script>
    /* ==========================================================
       APPLICATION STATE
       ========================================================== */
    const state = {
      userCoords: null,         // [lat, lon]
      userAccuracy: null,       // meters
      userHeading: null,        // degrees from motion
      compassHeading: null,     // degrees from device compass
      currentSpeedKmh: 0,       // current speed
      speedLimitKmh: 50,        // speed limit
      destination: null,        // [lat, lon]
      isAutoFollow: true,       // auto-follow user position
      is3DMode: false,          // 3D perspective camera mode
      searchMode: 'address',    // 'address' or 'poi'
      transportMode: 'driving', // 'driving', 'cycling', 'walking'
      speedHistory: [],         // Rolling 5s timestamped speed history
      activeRoute: null,        // OSRM route object
      routeCoordinates: [],     // Array of [lon, lat] for MapLibre GeoJSON
      routeRadars: [],          // Speed cameras on route
      radarMarkers: [],         // MapLibre markers
      lastPosTime: null,
      wakeLock: null,
      watchId: null
    };

    /* ==========================================================
       LOCALSTORAGE HISTORY MANAGER
       ========================================================== */
    const HISTORY_KEY = 'wake_recent_destinations';

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveToHistory(item) {
      // item: { title, subtitle, lat, lon, type }
      let history = getHistory();
      // Remove existing item with same coords or title
      history = history.filter(h => !(Math.abs(h.lat - item.lat) < 0.0001 && Math.abs(h.lon - item.lon) < 0.0001));
      history.unshift({
        title: item.title,
        subtitle: item.subtitle || '',
        lat: item.lat,
        lon: item.lon,
        type: item.type || 'address',
        timestamp: Date.now()
      });
      if (history.length > 5) history = history.slice(0, 5);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    }

    function clearHistory() {
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
    }

    /* ==========================================================
       MAPLIBRE GL INITIALIZATION (3D & VECTOR TILES)
       ========================================================== */
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [2.3522, 48.8566],
      zoom: 16,
      pitch: 0,
      bearing: 0,
      attributionControl: true
    });

    map.on('load', () => {
      // Add Route Source and Layers
      map.addSource('route', {
        type: 'geojson',
        data: {
          type: 'Feature',
          properties: {},
          geometry: { type: 'LineString', coordinates: [] }
        }
      });

      // White outline casing for route
      map.addLayer({
        id: 'route-casing',
        type: 'line',
        source: 'route',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#FFFFFF',
          'line-width': 10,
          'line-opacity': 0.95
        }
      });

      // Distinct thick blue route line
      map.addLayer({
        id: 'route-line',
        type: 'line',
        source: 'route',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#0066FF',
          'line-width': 6,
          'line-opacity': 1.0
        }
      });

      // Enable 3D Buildings if available in the vector style
      const layers = map.getStyle().layers;
      const labelLayer = layers.find(l => l.type === 'symbol' && l.layout && l.layout['text-field']);
      const labelLayerId = labelLayer ? labelLayer.id : undefined;

      if (!map.getLayer('3d-buildings') && map.getSource('openmaptiles')) {
        map.addLayer({
          id: '3d-buildings',
          source: 'openmaptiles',
          'source-layer': 'building',
          type: 'fill-extrusion',
          minzoom: 14,
          paint: {
            'fill-extrusion-color': '#d1d8e0',
            'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 12],
            'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], ['get', 'min_height'], 0],
            'fill-extrusion-opacity': 0.85
          }
        }, labelLayerId);
      }
    });

    /* ==========================================================
       USER LOCATION & DESTINATION MARKERS
       ========================================================== */
    // Create User Marker DOM Element with Vision Beam
    const userMarkerEl = document.createElement('div');
    userMarkerEl.className = 'user-marker-container';
    userMarkerEl.innerHTML = `
      <div class="user-beam" id="userBeam">
        <svg viewBox="0 0 160 160" width="160" height="160">
          <defs>
            <radialGradient id="beamGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
              <stop offset="0%" stop-color="#007AFF" stop-opacity="0.55" />
              <stop offset="35%" stop-color="#007AFF" stop-opacity="0.30" />
              <stop offset="70%" stop-color="#007AFF" stop-opacity="0.10" />
              <stop offset="100%" stop-color="#007AFF" stop-opacity="0.0" />
            </radialGradient>
          </defs>
          <path d="M 80 80 L 30 10 A 80 80 0 0 1 130 10 Z" fill="url(#beamGrad)" />
        </svg>
      </div>
      <div class="user-dot"></div>
    `;

    const userMarker = new maplibregl.Marker({
      element: userMarkerEl,
      anchor: 'center',
      pitchAlignment: 'map',
      rotationAlignment: 'map'
    });

    // Destination Marker DOM Element
    const destMarkerEl = document.createElement('div');
    destMarkerEl.innerHTML = '<div class="dest-dot"></div>';
    const destMarker = new maplibregl.Marker({
      element: destMarkerEl,
      anchor: 'center',
      pitchAlignment: 'map',
      rotationAlignment: 'map'
    });

    /* ==========================================================
       DOM ELEMENTS
       ========================================================== */
    const routeHud = document.getElementById('routeHud');
    const hudTime = document.getElementById('hudTime');
    const hudDist = document.getElementById('hudDist');
    const hudEta = document.getElementById('hudEta');
    const hudTrafficBadge = document.getElementById('hudTrafficBadge');
    const hudRadarAlert = document.getElementById('hudRadarAlert');
    const hudRadarText = document.getElementById('hudRadarText');
    const transportButtons = document.querySelectorAll('.transport-btn');
    const btnClearRoute = document.getElementById('btnClearRoute');
    const btnRecenter = document.getElementById('btnRecenter');
    const btn3D = document.getElementById('btn3D');
    const label3D = document.getElementById('label3D');
    const searchInput = document.getElementById('searchInput');
    const dropdownContainer = document.getElementById('dropdownContainer');
    const toast = document.getElementById('toast');
    const speedValEl = document.getElementById('speedVal');
    const speedLimitSignEl = document.getElementById('speedLimitSign');
    const speedLimitValEl = document.getElementById('speedLimitVal');

    function showToast(message, duration = 3000) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    /* ==========================================================
       3D PERSPECTIVE CAMERA TOGGLE
       ========================================================== */
    btn3D.addEventListener('click', () => {
      state.is3DMode = !state.is3DMode;
      btn3D.classList.toggle('active', state.is3DMode);
      label3D.textContent = state.is3DMode ? '2D' : '3D';

      updateCameraPosition(true);
      showToast(state.is3DMode ? 'Mode 3D Activé' : 'Mode 2D Activé');
    });

    function updateCameraPosition(animate = false) {
      if (!state.userCoords) return;
      const [lat, lon] = state.userCoords;
      const effectiveHeading = state.userHeading !== null ? state.userHeading : (state.compassHeading || 0);

      if (state.is3DMode) {
        // Perspective 3D cockpit view
        map.easeTo({
          center: [lon, lat],
          pitch: 60,
          bearing: effectiveHeading,
          zoom: Math.max(map.getZoom(), 17),
          duration: animate ? 800 : 300
        });
      } else {
        // Flat 2D North-up view
        map.easeTo({
          center: [lon, lat],
          pitch: 0,
          bearing: 0,
          zoom: Math.max(map.getZoom(), 16),
          duration: animate ? 800 : 300
        });
      }
    }

    /* ==========================================================
       SPEEDOMETER & ROLLING AVERAGE (5-SECOND SMOOTHING)
       ========================================================== */
    function getSmoothedSpeed(rawSpeedKmh, now = Date.now()) {
      state.speedHistory.push({ time: now, speed: rawSpeedKmh });
      // Filter out records older than 5 seconds
      state.speedHistory = state.speedHistory.filter(entry => now - entry.time <= 5000);

      // Fast-stop detection: consecutive stationary readings reset immediately
      if (rawSpeedKmh === 0 && state.speedHistory.length >= 2) {
        const lastTwoZeros = state.speedHistory.slice(-2).every(e => e.speed === 0);
        if (lastTwoZeros) {
          state.speedHistory = [{ time: now, speed: 0 }];
          return 0;
        }
      }

      const sum = state.speedHistory.reduce((acc, entry) => acc + entry.speed, 0);
      return Math.round(sum / state.speedHistory.length);
    }

    function updateSpeed(newSpeedKmh) {
      state.currentSpeedKmh = Math.max(0, Math.round(newSpeedKmh));
      speedValEl.textContent = state.currentSpeedKmh;

      if (state.currentSpeedKmh > state.speedLimitKmh) {
        speedLimitSignEl.classList.add('overspeed');
      } else {
        speedLimitSignEl.classList.remove('overspeed');
      }
    }

    function setSpeedLimit(limit) {
      if (limit && !isNaN(limit) && limit > 0) {
        state.speedLimitKmh = parseInt(limit, 10);
        speedLimitValEl.textContent = state.speedLimitKmh;
      }
      updateSpeed(state.currentSpeedKmh);
    }

    /* ==========================================================
       HEADING & COMPASS ORIENTATION (ALIGNED IN 3D GROUND PLANE)
       ========================================================== */
    function updateHeadingDisplay(headingDeg) {
      const beamEl = document.getElementById('userBeam');
      if (beamEl && headingDeg !== null && !isNaN(headingDeg)) {
        beamEl.style.display = 'block';
        beamEl.style.transform = `rotate(${headingDeg}deg)`;
      }
    }

    function handleDeviceOrientation(e) {
      let compass = null;
      if (e.webkitCompassHeading !== undefined) {
        compass = e.webkitCompassHeading;
      } else if (e.alpha !== null) {
        compass = 360 - e.alpha;
      }

      if (compass !== null) {
        state.compassHeading = compass;
        if (state.currentSpeedKmh < 5 || state.userHeading === null) {
          updateHeadingDisplay(compass);
          if (state.is3DMode && state.isAutoFollow) {
            map.setBearing(compass);
          }
        }
      }
    }

    function initCompassPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then((p) => {
            if (p === 'granted') {
              window.addEventListener('deviceorientation', handleDeviceOrientation, true);
            }
          }).catch(console.warn);
      } else {
        window.addEventListener('deviceorientation', handleDeviceOrientation, true);
      }
    }

    /* ==========================================================
       GPS TRACKING (GEOLOCATION API)
       ========================================================== */
    function initGPS() {
      if (!('geolocation' in navigator)) {
        showToast('Géolocalisation non supportée');
        return;
      }

      const geoOptions = { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 };

      // Immediate first fix
      navigator.geolocation.getCurrentPosition(
        onLocationSuccess,
        (err) => console.warn('Fast GPS fix:', err.message),
        { enableHighAccuracy: true, timeout: 5000 }
      );

      // Continuous tracking
      state.watchId = navigator.geolocation.watchPosition(
        onLocationSuccess,
        onLocationError,
        geoOptions
      );
    }

    function onLocationSuccess(pos) {
      const { latitude, longitude, accuracy, heading, speed } = pos.coords;
      const now = Date.now();
      const prevCoords = state.userCoords;

      // 1. Anti-Jitter Filter (< 3 meters is considered micro-movement / drift)
      const distMoved = prevCoords ? calculateDistance(prevCoords[0], prevCoords[1], latitude, longitude) : 999;
      const isJitter = prevCoords && distMoved < 3;

      let effectiveLat = latitude;
      let effectiveLon = longitude;

      if (isJitter) {
        // Micro-drift (< 1.5m): lock to previous coordinates to prevent visual map jitter
        if (distMoved < 1.5) {
          effectiveLat = prevCoords[0];
          effectiveLon = prevCoords[1];
        }
      }

      state.userCoords = [effectiveLat, effectiveLon];
      state.userAccuracy = accuracy;

      // 2. Instantaneous Speed calculation (0 if jittering / stationary)
      let rawSpeedKmh = 0;
      if (!isJitter) {
        if (speed !== null && !isNaN(speed) && speed >= 0) {
          rawSpeedKmh = speed * 3.6;
        } else if (prevCoords && state.lastPosTime) {
          const dt = (now - state.lastPosTime) / 1000;
          if (dt > 0.4 && dt < 10) {
            rawSpeedKmh = (distMoved / dt) * 3.6;
          }
        }
      }

      // 3. 5-Second Rolling Average for Speed & Live ETA
      const smoothedSpeedKmh = getSmoothedSpeed(rawSpeedKmh, now);
      state.lastPosTime = now;
      updateSpeed(smoothedSpeedKmh);

      // 4. Heading calculation (only when moving >= 4 km/h without jitter to prevent spinning)
      if (heading !== null && !isNaN(heading) && smoothedSpeedKmh >= 4 && !isJitter) {
        state.userHeading = heading;
        updateHeadingDisplay(heading);
      } else if (state.compassHeading !== null) {
        updateHeadingDisplay(state.compassHeading);
      }

      // 5. Update User Marker position
      userMarker.setLngLat([effectiveLon, effectiveLat]).addTo(map);

      // 6. Auto-follow Camera
      if (state.isAutoFollow) {
        updateCameraPosition(false);
      }

      // 7. Dynamic Route Recalculation & Live ETA (no unnecessary heavy server calls)
      if (state.destination && prevCoords && state.routeCoordinates.length > 1) {
        const offRouteDist = minDistanceToRoute(effectiveLat, effectiveLon, state.routeCoordinates);
        if (offRouteDist > 65) {
          calculateRoute(state.destination, false);
        } else {
          updateLiveETA();
        }
      }

      checkUpcomingRadars(effectiveLat, effectiveLon);
    }

    function onLocationError(err) {
      console.warn('Geolocation error:', err.message);
      if (err.code === 1) {
        showToast('Activez la localisation pour le suivi GPS');
      } else {
        showToast('Signal GPS faible...');
      }
    }

    /* ==========================================================
       USER INTERACTIONS & AUTO-FOLLOW
       ========================================================== */
    map.on('dragstart', () => {
      state.isAutoFollow = false;
      btnRecenter.classList.remove('active');
    });

    btnRecenter.addEventListener('click', () => {
      state.isAutoFollow = true;
      btnRecenter.classList.add('active');
      if (state.userCoords) {
        updateCameraPosition(true);
      } else {
        showToast('Recherche de votre position GPS...');
      }
    });

    map.on('click', (e) => {
      const latlng = [e.lngLat.lat, e.lngLat.lng];
      setDestination(latlng, 'Position sur la carte', 'Point sélectionné');
    });

    function setDestination(latlng, title = 'Destination', subtitle = '') {
      state.destination = latlng;
      const [lat, lon] = latlng;

      destMarker.setLngLat([lon, lat]).addTo(map);

      // Save to recent history
      saveToHistory({
        title: title,
        subtitle: subtitle,
        lat: lat,
        lon: lon,
        type: state.searchMode
      });

      closeDropdown();

      if (!state.userCoords) {
        showToast('En attente du signal GPS...');
        return;
      }

      calculateRoute(latlng, true);
    }

    /* ==========================================================
       OSRM ROUTING, TRANSPORT MODES & PEAK HOUR TRAFFIC
       ========================================================== */
    function isPeakHour() {
      const now = new Date();
      const day = now.getDay(); // 0 is Sunday, 1-5 Mon-Fri, 6 Sat
      const hour = now.getHours();
      const isWeekday = day >= 1 && day <= 5;
      const isPeak = (hour >= 7 && hour < 9) || (hour >= 17 && hour < 19);
      return isWeekday && isPeak;
    }

    // Transport Mode Buttons Click Listeners
    transportButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const mode = btn.dataset.mode;
        if (state.transportMode === mode) return;

        state.transportMode = mode;
        transportButtons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));

        const modeLabels = { driving: 'Voiture', cycling: 'Vélo', walking: 'Piéton' };
        showToast(`Mode ${modeLabels[mode] || mode}`);

        if (state.destination) {
          calculateRoute(state.destination, false);
        }
      });
    });

    async function calculateRoute(destCoords, fitBounds = true) {
      if (!state.userCoords) return;

      const [startLat, startLon] = state.userCoords;
      const [destLat, destLon] = destCoords;
      const mode = state.transportMode || 'driving';

      // Select dedicated routing server
      let primaryHost = 'https://routing.openstreetmap.de/routed-car';
      if (mode === 'cycling') primaryHost = 'https://routing.openstreetmap.de/routed-bike';
      if (mode === 'walking') primaryHost = 'https://routing.openstreetmap.de/routed-foot';

      const routeQuery = `${startLon},${startLat};${destLon},${destLat}?overview=full&geometries=geojson&steps=true`;

      try {
        let response = await fetch(`${primaryHost}/route/v1/driving/${routeQuery}`).catch(() => null);
        let data = response && response.ok ? await response.json() : null;

        // Fallback to project-osrm.org
        if (!data || data.code !== 'Ok' || !data.routes || !data.routes.length) {
          response = await fetch(`https://router.project-osrm.org/route/v1/driving/${routeQuery}`);
          data = await response.json();
        }

        if (!data || data.code !== 'Ok' || !data.routes || !data.routes.length) {
          showToast('Itinéraire introuvable');
          return;
        }

        const route = data.routes[0];
        state.activeRoute = route;
        state.routeCoordinates = route.geometry.coordinates; // [[lon, lat], ...]

        // Infer road speed limit according to transport mode
        inferSpeedLimitFromRoute(route);

        // Update GeoJSON route source in MapLibre
        const routeSource = map.getSource('route');
        if (routeSource) {
          routeSource.setData({
            type: 'Feature',
            properties: {},
            geometry: route.geometry
          });
        }

        // Calculate realistic travel duration per mode
        let effectiveDurationSec = route.duration;
        const avgSpeedKmh = (route.distance / route.duration) * 3.6;

        if (mode === 'cycling') {
          // If server returned car speeds (> 28 km/h), compute realistic bike pace (~14.5 km/h)
          if (avgSpeedKmh > 28) {
            effectiveDurationSec = (route.distance / 1000) / 14.5 * 3600;
          }
        } else if (mode === 'walking') {
          // If server returned car speeds (> 7 km/h), compute realistic walking pace (~4.8 km/h)
          if (avgSpeedKmh > 7) {
            effectiveDurationSec = (route.distance / 1000) / 4.8 * 3600;
          }
        } else {
          // Car Mode: Apply peak hour penalty (+25% during Monday-Friday 7h-9h & 17h-19h)
          if (isPeakHour()) {
            effectiveDurationSec *= 1.25;
            hudTrafficBadge.classList.add('active');
          } else {
            hudTrafficBadge.classList.remove('active');
          }
        }

        if (mode !== 'driving') {
          hudTrafficBadge.classList.remove('active');
        }

        // Update HUD Metrics
        const distanceKm = (route.distance / 1000).toFixed(route.distance < 10000 ? 1 : 0);
        const durationMin = Math.max(1, Math.round(effectiveDurationSec / 60));

        hudDist.textContent = `${distanceKm} km`;
        if (durationMin >= 60) {
          const h = Math.floor(durationMin / 60);
          const m = durationMin % 60;
          hudTime.textContent = `${h} h ${m.toString().padStart(2, '0')} min`;
        } else {
          hudTime.textContent = `${durationMin} min`;
        }

        // ETA calculation
        const etaDate = new Date(Date.now() + effectiveDurationSec * 1000);
        const etaH = etaDate.getHours().toString().padStart(2, '0');
        const etaM = etaDate.getMinutes().toString().padStart(2, '0');
        hudEta.textContent = `Arrivée ${etaH}:${etaM}`;

        routeHud.classList.add('active');

        if (fitBounds && !state.is3DMode) {
          const bounds = new maplibregl.LngLatBounds();
          state.routeCoordinates.forEach(c => bounds.extend(c));
          map.fitBounds(bounds, { padding: { top: 120, bottom: 80, left: 60, right: 60 }, maxZoom: 17 });
          state.isAutoFollow = false;
          btnRecenter.classList.remove('active');
        }

        // Fetch speed cameras only when driving
        if (mode === 'driving') {
          fetchSpeedCamerasOnRoute(state.routeCoordinates);
        } else {
          clearRadarMarkers();
        }

      } catch (err) {
        console.error('OSRM error:', err);
        showToast('Erreur lors du calcul de route');
      }
    }

    function inferSpeedLimitFromRoute(route) {
      if (state.transportMode === 'cycling') {
        setSpeedLimit(25);
        return;
      }
      if (state.transportMode === 'walking') {
        setSpeedLimit(6);
        return;
      }

      if (route.legs && route.legs[0] && route.legs[0].steps && route.legs[0].steps.length) {
        const firstStep = route.legs[0].steps[0];
        const roadName = (firstStep.name || '').toLowerCase();
        const ref = (firstStep.ref || '').toLowerCase();

        if (ref.startsWith('a') || roadName.includes('autoroute')) {
          setSpeedLimit(130);
        } else if (ref.startsWith('n') || roadName.includes('voie rapide') || roadName.includes('rocade')) {
          setSpeedLimit(110);
        } else if (ref.startsWith('d') || roadName.includes('route')) {
          setSpeedLimit(80);
        } else {
          setSpeedLimit(50);
        }
      }
    }

    /* ==========================================================
       DYNAMIC LIVE ETA (LOCAL CONTINUOUS & 10s PERIODIC UPDATE)
       ========================================================== */
    function getRemainingRouteDistance(userLat, userLon, routeCoords) {
      if (!routeCoords || routeCoords.length < 2) return 0;

      let minDistance = Infinity;
      let closestIndex = 0;

      for (let i = 0; i < routeCoords.length - 1; i++) {
        const [aLon, aLat] = routeCoords[i];
        const [bLon, bLat] = routeCoords[i + 1];
        const d = distToSegment(userLat, userLon, aLat, aLon, bLat, bLon);
        if (d < minDistance) {
          minDistance = d;
          closestIndex = i;
        }
      }

      // Distance from user to next route point
      const [nextLon, nextLat] = routeCoords[closestIndex + 1];
      let remainingMeters = calculateDistance(userLat, userLon, nextLat, nextLon);

      // Sum all remaining segments along route
      for (let i = closestIndex + 1; i < routeCoords.length - 1; i++) {
        const [aLon, aLat] = routeCoords[i];
        const [bLon, bLat] = routeCoords[i + 1];
        remainingMeters += calculateDistance(aLat, aLon, bLat, bLon);
      }

      return remainingMeters;
    }

    function updateLiveETA() {
      if (!state.destination || !state.activeRoute || !state.userCoords || !state.routeCoordinates.length) {
        return;
      }

      const [userLat, userLon] = state.userCoords;
      const mode = state.transportMode || 'driving';
      const remMeters = getRemainingRouteDistance(userLat, userLon, state.routeCoordinates);

      // Destination reached check (< 20m)
      if (remMeters < 20) {
        showToast('Vous êtes arrivé à destination ! 🎉');
        clearRoute();
        return;
      }

      // Baseline speed per transport mode
      let baseSpeedKmh = 50;
      if (mode === 'cycling') baseSpeedKmh = 14.5;
      if (mode === 'walking') baseSpeedKmh = 4.8;

      let effectiveSpeed = baseSpeedKmh;
      const currentSpeed = state.currentSpeedKmh || 0;

      // Real-time speed adaptation (e.g. driving 180 km/h, city cruising, running, etc.)
      if (currentSpeed > 4) {
        if (mode === 'driving') {
          if (currentSpeed > baseSpeedKmh) {
            effectiveSpeed = currentSpeed * 0.9 + baseSpeedKmh * 0.1;
          } else {
            effectiveSpeed = currentSpeed * 0.6 + baseSpeedKmh * 0.4;
          }
        } else if (mode === 'cycling') {
          effectiveSpeed = Math.max(8, Math.min(45, currentSpeed * 0.75 + baseSpeedKmh * 0.25));
        } else if (mode === 'walking') {
          effectiveSpeed = Math.max(3, Math.min(15, currentSpeed * 0.75 + baseSpeedKmh * 0.25));
        }
      }

      let durationSec = (remMeters / 1000) / effectiveSpeed * 3600;

      // Peak hour adjustment in car mode
      const isPeak = mode === 'driving' && isPeakHour();
      if (isPeak && currentSpeed < 45) {
        durationSec *= 1.25;
        hudTrafficBadge.classList.add('active');
      } else {
        hudTrafficBadge.classList.remove('active');
      }

      // Update HUD values smoothly
      const distanceKm = (remMeters / 1000).toFixed(remMeters < 10000 ? 1 : 0);
      const durationMin = Math.max(1, Math.round(durationSec / 60));

      hudDist.textContent = `${distanceKm} km`;
      if (durationMin >= 60) {
        const h = Math.floor(durationMin / 60);
        const m = durationMin % 60;
        hudTime.textContent = `${h} h ${m.toString().padStart(2, '0')} min`;
      } else {
        hudTime.textContent = `${durationMin} min`;
      }

      const etaDate = new Date(Date.now() + durationSec * 1000);
      const etaH = etaDate.getHours().toString().padStart(2, '0');
      const etaM = etaDate.getMinutes().toString().padStart(2, '0');
      hudEta.textContent = `Arrivée ${etaH}:${etaM}`;
    }

    // Periodic live ETA tick every 10 seconds
    setInterval(updateLiveETA, 10000);

    function clearRoute() {
      state.destination = null;
      state.activeRoute = null;
      state.routeCoordinates = [];

      destMarker.remove();

      const routeSource = map.getSource('route');
      if (routeSource) {
        routeSource.setData({
          type: 'Feature',
          properties: {},
          geometry: { type: 'LineString', coordinates: [] }
        });
      }

      clearRadarMarkers();
      routeHud.classList.remove('active');
      searchInput.value = '';
      closeDropdown();
      setSpeedLimit(50);
    }

    btnClearRoute.addEventListener('click', clearRoute);

    /* ==========================================================
       RADARS ON ROUTE (OVERPASS API)
       ========================================================== */
    async function fetchSpeedCamerasOnRoute(routeCoords) {
      clearRadarMarkers();
      if (!routeCoords || routeCoords.length < 2) return;

      let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
      for (const [lon, lat] of routeCoords) {
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
      }
      minLat -= 0.01; maxLat += 0.01;
      minLon -= 0.01; maxLon += 0.01;

      const bbox = `${minLat.toFixed(4)},${minLon.toFixed(4)},${maxLat.toFixed(4)},${maxLon.toFixed(4)}`;
      const query = `[out:json][timeout:8];(node["highway"="speed_camera"](${bbox});node["enforcement"="maxspeed"](${bbox}););out body;`;

      try {
        const params = new URLSearchParams();
        params.append('data', query);
        const res = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: params,
          headers: { 'User-Agent': 'WakeGPS/1.0' }
        });
        const data = await res.json();
        if (!data || !data.elements) return;

        state.routeRadars = [];
        for (const el of data.elements) {
          const camLat = el.lat;
          const camLon = el.lon;
          const distToRoute = minDistanceToRoute(camLat, camLon, routeCoords);

          if (distToRoute <= 35) {
            const speedLimit = el.tags?.maxspeed || el.tags?.['maxspeed:type'] || 'RADAR';
            state.routeRadars.push({ lat: camLat, lon: camLon, maxspeed: speedLimit, id: el.id });

            const radarEl = document.createElement('div');
            radarEl.className = 'radar-marker-pin';
            radarEl.innerHTML = `
              <div class="radar-badge">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                <span>${speedLimit}</span>
              </div>
            `;

            const m = new maplibregl.Marker({ element: radarEl, anchor: 'bottom' })
              .setLngLat([camLon, camLat])
              .addTo(map);

            state.radarMarkers.push(m);
          }
        }

        if (state.routeRadars.length > 0) {
          showToast(`${state.routeRadars.length} radar(s) détecté(s) sur votre trajet`);
        }
      } catch (err) {
        console.warn('Radar fetch error:', err);
      }
    }

    function checkUpcomingRadars(userLat, userLon) {
      if (!state.routeRadars || !state.routeRadars.length) {
        hudRadarAlert.classList.remove('active');
        return;
      }

      let closestRadar = null;
      let minDistance = Infinity;

      for (const radar of state.routeRadars) {
        const d = calculateDistance(userLat, userLon, radar.lat, radar.lon);
        if (d < minDistance) {
          minDistance = d;
          closestRadar = radar;
        }
      }

      if (closestRadar && minDistance <= 600) {
        hudRadarText.textContent = `Radar à ${Math.round(minDistance)}m (${closestRadar.maxspeed} km/h)`;
        hudRadarAlert.classList.add('active');
        if (closestRadar.maxspeed && !isNaN(closestRadar.maxspeed)) {
          setSpeedLimit(closestRadar.maxspeed);
        }
      } else {
        hudRadarAlert.classList.remove('active');
      }
    }

    function clearRadarMarkers() {
      state.radarMarkers.forEach(m => m.remove());
      state.radarMarkers = [];
      state.routeRadars = [];
      hudRadarAlert.classList.remove('active');
    }

    /* ==========================================================
       SEARCH & RECENT HISTORY DROPDOWN (UNIFIED ADRESSE & POI)
       ========================================================== */
    let searchDebounce = null;

    searchInput.addEventListener('focus', () => {
      if (searchInput.value.trim() === '') {
        renderHistory();
      }
    });

    searchInput.addEventListener('input', () => {
      triggerSearch();
    });

    function triggerSearch() {
      const q = searchInput.value.trim();
      clearTimeout(searchDebounce);

      if (q === '') {
        renderHistory();
        return;
      }

      if (q.length < 2) {
        closeDropdown();
        return;
      }

      searchDebounce = setTimeout(() => {
        searchPhoton(q);
      }, 250);
    }

    function renderHistory() {
      const history = getHistory();
      if (!history.length) {
        closeDropdown();
        return;
      }

      let html = `
        <div class="dropdown-header">
          <span>Récents</span>
          <button class="btn-clear-history" id="btnClearHistory">Effacer</button>
        </div>
      `;

      html += history.map(item => {
        let distText = '';
        if (state.userCoords) {
          const dMeters = calculateDistance(state.userCoords[0], state.userCoords[1], item.lat, item.lon);
          distText = formatDistance(dMeters);
        }
        const icon = item.type === 'poi' ? '🏷️' : '📍';
        return `
          <div class="list-item" data-lat="${item.lat}" data-lon="${item.lon}" data-title="${escapeHtml(item.title)}" data-subtitle="${escapeHtml(item.subtitle)}">
            <div class="list-item-icon">${icon}</div>
            <div class="list-item-content">
              <div class="list-item-title">${escapeHtml(item.title)}</div>
              <div class="list-item-subtitle">${escapeHtml(item.subtitle || 'Position enregistrée')}</div>
            </div>
            ${distText ? `<div class="list-item-meta">${distText}</div>` : ''}
          </div>
        `;
      }).join('');

      dropdownContainer.innerHTML = html;
      dropdownContainer.classList.add('active');

      const btnClear = document.getElementById('btnClearHistory');
      if (btnClear) {
        btnClear.addEventListener('click', (e) => {
          e.stopPropagation();
          clearHistory();
        });
      }
    }

    /* ==========================================================
       PHOTON SEARCH ENGINE (KOMOOT - ADRESSES & POI INTELLIGENTS)
       ========================================================== */
    function getSearchAnchor() {
      if (state.userCoords && state.userCoords[0] && state.userCoords[1]) {
        return state.userCoords;
      }
      const c = map.getCenter();
      return [c.lat, c.lng];
    }

    async function searchPhoton(q) {
      const [anchorLat, anchorLon] = getSearchAnchor();

      dropdownContainer.innerHTML = '<div class="list-item" style="color:#8E8E93;"><div class="list-item-icon">⏳</div><div class="list-item-content"><div class="list-item-title">Recherche en cours...</div></div></div>';
      dropdownContainer.classList.add('active');

      const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${anchorLat.toFixed(5)}&lon=${anchorLon.toFixed(5)}&limit=6&lang=fr`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('Photon API status ' + res.status);
        const data = await res.json();

        if (!data || !data.features || !data.features.length) {
          dropdownContainer.innerHTML = '<div class="list-item" style="color:#8E8E93;"><div class="list-item-icon">📍</div><div class="list-item-content"><div class="list-item-title">Aucun résultat trouvé</div></div></div>';
          dropdownContainer.classList.add('active');
          return;
        }

        const items = data.features.map(f => {
          const [lon, lat] = f.geometry.coordinates;
          const prop = f.properties || {};

          // Determine clean title
          const title = prop.name || [prop.housenumber, prop.street].filter(Boolean).join(' ') || prop.city || q;

          // Determine clean formatted subtitle
          const addressParts = [
            [prop.housenumber, prop.street].filter(Boolean).join(' '),
            prop.postcode,
            prop.city,
            prop.county
          ].filter(Boolean);

          const subtitle = addressParts.filter(p => p !== title).join(', ') || prop.country || '';

          // Determine category icon
          const isPoi = prop.osm_key === 'shop' || prop.osm_key === 'amenity' || prop.osm_key === 'tourism' || prop.osm_key === 'leisure';
          const icon = isPoi ? '🏷️' : '📍';

          const dMeters = calculateDistance(anchorLat, anchorLon, lat, lon);

          return {
            title: title,
            subtitle: subtitle,
            lat: lat,
            lon: lon,
            type: isPoi ? 'poi' : 'address',
            dMeters: dMeters,
            icon: icon
          };
        });

        dropdownContainer.innerHTML = items.map(item => {
          const distStr = item.dMeters < Infinity ? formatDistance(item.dMeters) : '';
          return `
            <div class="list-item" data-lat="${item.lat}" data-lon="${item.lon}" data-title="${escapeHtml(item.title)}" data-subtitle="${escapeHtml(item.subtitle)}">
              <div class="list-item-icon">${item.icon}</div>
              <div class="list-item-content">
                <div class="list-item-title">${escapeHtml(item.title)}</div>
                <div class="list-item-subtitle">${escapeHtml(item.subtitle)}</div>
              </div>
              ${distStr ? `<div class="list-item-meta">${distStr}</div>` : ''}
            </div>
          `;
        }).join('');

        dropdownContainer.classList.add('active');

      } catch (err) {
        console.error('Photon search error:', err);
        dropdownContainer.innerHTML = '<div class="list-item" style="color:#8E8E93;"><div class="list-item-icon">⚠️</div><div class="list-item-content"><div class="list-item-title">Erreur lors de la recherche</div></div></div>';
        dropdownContainer.classList.add('active');
      }
    }

    dropdownContainer.addEventListener('click', (e) => {
      const item = e.target.closest('.list-item');
      if (!item || !item.dataset.lat) return;

      const lat = parseFloat(item.dataset.lat);
      const lon = parseFloat(item.dataset.lon);
      const title = item.dataset.title || 'Destination';
      const subtitle = item.dataset.subtitle || '';

      searchInput.value = title;
      setDestination([lat, lon], title, subtitle);
    });

    function closeDropdown() {
      dropdownContainer.classList.remove('active');
      dropdownContainer.innerHTML = '';
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.top-container')) {
        closeDropdown();
      }
    });

    /* ==========================================================
       GEOMETRIC & DISTANCE UTILITIES
       ========================================================== */
    function formatDistance(meters) {
      if (meters < 1000) {
        return `${Math.round(meters)} m`;
      }
      return `${(meters / 1000).toFixed(1)} km`;
    }

    function minDistanceToRoute(pLat, pLon, routeCoords) {
      let minDist = Infinity;
      for (let i = 0; i < routeCoords.length - 1; i++) {
        const [aLon, aLat] = routeCoords[i];
        const [bLon, bLat] = routeCoords[i + 1];
        const dist = distToSegment(pLat, pLon, aLat, aLon, bLat, bLon);
        if (dist < minDist) minDist = dist;
      }
      return minDist;
    }

    function distToSegment(pLat, pLon, aLat, aLon, bLat, bLon) {
      const x = (pLon - aLon) * Math.cos((aLat + bLat) * Math.PI / 360) * 111320;
      const y = (pLat - aLat) * 110540;
      const dx = (bLon - aLon) * Math.cos((aLat + bLat) * Math.PI / 360) * 111320;
      const dy = (bLat - aLat) * 110540;
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return Math.sqrt(x * x + y * y);
      let t = Math.max(0, Math.min(1, (x * dx + y * dy) / lenSq));
      const projX = t * dx;
      const projY = t * dy;
      return Math.sqrt((x - projX) * (x - projX) + (y - projY) * (y - projY));
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    /* ==========================================================
       WAKE LOCK & PERMISSION TRIGGERS
       ========================================================== */
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          state.wakeLock = await navigator.wakeLock.request('screen');
        } catch (e) {
          console.warn('WakeLock error:', e);
        }
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    window.addEventListener('click', () => {
      if (!state.wakeLock) requestWakeLock();
      initCompassPermission();
    }, { once: true });

    /* ==========================================================
       SERVICE WORKER REGISTRATION
       ========================================================== */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('SW registered:', reg.scope))
          .catch((err) => console.warn('SW error:', err));
      });
    }

    // Launch GPS immediately
    initGPS();
  </script>
