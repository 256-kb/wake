<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Wake</title>

  <!-- PWA & Mobile Web App Meta -->
  <meta name="theme-color" content="#007AFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wake" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png" />
  <link rel="icon" type="image/webp" href="icons/icon.webp" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="shortcut icon" href="favicon.ico" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <style>
    :root {
      --primary: #007AFF;
      --primary-dark: #0056b3;
      --danger: #FF3B30;
      --bg-glass: rgba(255, 255, 255, 0.92);
      --bg-glass-dark: rgba(28, 28, 30, 0.88);
      --text-dark: #1c1c1e;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #e5e3df;
    }

    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* ==========================================================
       USER LOCATION MARKER & ROTATING VISION BEAM
       ========================================================== */
    .user-marker-container {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .user-beam {
      position: absolute;
      width: 160px;
      height: 160px;
      top: 0;
      left: 0;
      transform-origin: 80px 80px;
      transition: transform 0.12s linear;
      pointer-events: none;
      display: none;
    }

    .user-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
      background-color: #007AFF;
      border: 3.5px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }

    /* Destination Marker */
    .dest-dot {
      width: 20px;
      height: 20px;
      background-color: #1C1C1E;
      border: 3.5px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
      position: relative;
    }
    .dest-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      background-color: #FF3B30;
      border-radius: 50%;
    }

    /* Radar Map Marker (Shown ONLY on active route) */
    .radar-marker-pin {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .radar-badge {
      background: #1C1C1E;
      color: #FFFFFF;
      border: 2px solid #FF9500;
      border-radius: 8px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .radar-badge svg {
      width: 12px;
      height: 12px;
      fill: #FF9500;
    }

    /* Top Floating Search & HUD Area */
    .top-container {
      position: absolute;
      top: calc(var(--safe-top) + 12px);
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .search-box {
      pointer-events: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      padding: 6px 12px;
      border: 0.5px solid rgba(255, 255, 255, 0.6);
      transition: all 0.3s ease;
    }

    .search-box input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15px;
      color: var(--text-dark);
      padding: 6px 8px;
      outline: none;
      font-family: inherit;
    }

    .search-box input::placeholder {
      color: #8E8E93;
    }

    .search-icon {
      color: #8E8E93;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Route HUD Info Banner */
    .route-hud {
      pointer-events: auto;
      background: var(--bg-glass-dark);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      padding: 12px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      color: #FFFFFF;
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      animation: slideDown 0.3s ease;
    }

    .route-hud.active {
      display: flex;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hud-metrics {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hud-primary {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .hud-time {
      color: #30D158;
    }

    .hud-dist {
      font-size: 14px;
      font-weight: 500;
      color: #EBEBF599;
    }

    /* Radar alert in HUD */
    .hud-radar-alert {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #FF9F0A;
      margin-top: 2px;
    }

    .hud-radar-alert.active {
      display: flex;
    }

    .btn-clear-route {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #FFFFFF;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-clear-route:active {
      background: rgba(255, 255, 255, 0.3);
    }

    /* ==========================================================
       BOTTOM LEFT: SPEEDOMETER & SPEED LIMIT SIGN
       ========================================================== */
    .bottom-left-hud {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 24px);
      left: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    /* Speed Limit Sign (European Round Road Sign) */
    .speed-limit-sign {
      width: 44px;
      height: 44px;
      background: #FFFFFF;
      border: 4.5px solid #FF3B30;
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .speed-limit-val {
      font-size: 17px;
      font-weight: 900;
      color: #1C1C1E;
      letter-spacing: -0.5px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Blinking pulse when exceeding speed limit */
    @keyframes blinkOverspeed {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.8);
        background-color: #FFFFFF;
      }
      50% {
        transform: scale(1.22);
        box-shadow: 0 0 20px 8px rgba(255, 59, 48, 0.95);
        background-color: #FFD4D2;
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.8);
        background-color: #FFFFFF;
      }
    }

    .speed-limit-sign.overspeed {
      animation: blinkOverspeed 0.6s infinite ease-in-out;
      border-color: #FF1A0D;
    }

    /* Speedometer Pill */
    .speedometer-box {
      background: var(--bg-glass-dark);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 0.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      padding: 7px 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      color: #FFFFFF;
    }

    .speed-val {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
    }

    .speed-unit {
      font-size: 9px;
      font-weight: 700;
      color: #8E8E93;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    /* Floating Action Buttons (Bottom Right) */
    .fab-group {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 24px);
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fab {
      width: 48px;
      height: 48px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 50%;
      box-shadow: var(--shadow);
      border: 0.5px solid rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1C1C1E;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
    }

    .fab:active {
      transform: scale(0.92);
    }

    .fab.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    .fab svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Toast Notification */
    .toast {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 90px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(28, 28, 30, 0.92);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Search Autocomplete Results */
    .search-results {
      pointer-events: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 14px;
      box-shadow: var(--shadow);
      margin-top: 4px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      border: 0.5px solid rgba(255, 255, 255, 0.6);
    }

    .search-results.active {
      display: block;
    }

    .search-item {
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text-dark);
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.06);
      cursor: pointer;
      line-height: 1.3;
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:active {
      background: rgba(0, 122, 255, 0.1);
    }

    .leaflet-control-attribution {
      font-size: 9px !important;
      background: rgba(255, 255, 255, 0.6) !important;
      backdrop-filter: blur(5px);
      padding: 2px 6px !important;
      margin: 0 !important;
      border-top-left-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Map -->
  <div id="map"></div>

  <!-- Top Search & HUD Area -->
  <div class="top-container">
    <div class="search-box" id="searchBox">
      <div class="search-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <input type="text" id="searchInput" placeholder="Rechercher ou toucher la carte..." autocomplete="off" />
    </div>

    <!-- Search Results Dropdown -->
    <div class="search-results" id="searchResults"></div>

    <!-- Route Status HUD -->
    <div class="route-hud" id="routeHud">
      <div class="hud-metrics">
        <div class="hud-primary">
          <span class="hud-time" id="hudTime">-- min</span>
          <span class="hud-dist" id="hudDist">-- km</span>
        </div>
        <div class="hud-radar-alert" id="hudRadarAlert">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
          </svg>
          <span id="hudRadarText">Radar à 400m</span>
        </div>
      </div>
      <button class="btn-clear-route" id="btnClearRoute" title="Annuler l'itinéraire">✕</button>
    </div>
  </div>

  <!-- Bottom-Left Speedometer & Speed Limit Sign -->
  <div class="bottom-left-hud">
    <div class="speed-limit-sign" id="speedLimitSign">
      <span class="speed-limit-val" id="speedLimitVal">50</span>
    </div>
    <div class="speedometer-box">
      <div class="speed-val" id="speedVal">0</div>
      <div class="speed-unit">KM/H</div>
    </div>
  </div>

  <!-- Bottom-Right Floating Controls -->
  <div class="fab-group">
    <button class="fab active" id="btnRecenter" title="Recentrer">
      <svg viewBox="0 0 24 24">
        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
      </svg>
    </button>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    /* ==========================================================
       APPLICATION STATE
       ========================================================== */
    const state = {
      userCoords: null,         // [lat, lon]
      userAccuracy: null,       // meters
      userHeading: null,        // degrees (0 = North)
      compassHeading: null,     // degrees from device compass
      currentSpeedKmh: 0,       // current speed in km/h
      speedLimitKmh: 50,        // current road speed limit
      destination: null,        // [lat, lon]
      isAutoFollow: true,       // auto-center map on user
      activeRoute: null,        // OSRM route data
      routeCoordinates: [],     // Array of [lat, lon]
      routeRadars: [],          // Speed cameras filtered on the route
      radarMarkers: [],         // Leaflet markers for radars
      lastPosTime: null,
      wakeLock: null,
      watchId: null
    };

    /* ==========================================================
       MAP INITIALIZATION
       ========================================================== */
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: true
    }).setView([48.8566, 2.3522], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    /* ==========================================================
       CUSTOM USER MARKER WITH VISION CONE GRADIENT
       ========================================================== */
    const userMarkerIcon = L.divIcon({
      className: 'user-marker-icon-wrapper',
      html: `
        <div class="user-marker-container">
          <div class="user-beam" id="userBeam">
            <svg viewBox="0 0 160 160" width="160" height="160">
              <defs>
                <radialGradient id="beamGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                  <stop offset="0%" stop-color="#007AFF" stop-opacity="0.55" />
                  <stop offset="35%" stop-color="#007AFF" stop-opacity="0.30" />
                  <stop offset="70%" stop-color="#007AFF" stop-opacity="0.10" />
                  <stop offset="100%" stop-color="#007AFF" stop-opacity="0.0" />
                </radialGradient>
              </defs>
              <path d="M 80 80 L 30 10 A 80 80 0 0 1 130 10 Z" fill="url(#beamGrad)" />
            </svg>
          </div>
          <div class="user-dot"></div>
        </div>
      `,
      iconSize: [160, 160],
      iconAnchor: [80, 80]
    });

    let userMarker = null;
    let userAccuracyCircle = null;
    let destMarker = null;
    let routeBorderLayer = null;
    let routeLineLayer = null;

    const destMarkerIcon = L.divIcon({
      className: 'dest-marker',
      html: '<div class="dest-dot"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    /* ==========================================================
       DOM ELEMENTS
       ========================================================== */
    const routeHud = document.getElementById('routeHud');
    const hudTime = document.getElementById('hudTime');
    const hudDist = document.getElementById('hudDist');
    const hudRadarAlert = document.getElementById('hudRadarAlert');
    const hudRadarText = document.getElementById('hudRadarText');
    const btnClearRoute = document.getElementById('btnClearRoute');
    const btnRecenter = document.getElementById('btnRecenter');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const toast = document.getElementById('toast');
    const speedValEl = document.getElementById('speedVal');
    const speedLimitSignEl = document.getElementById('speedLimitSign');
    const speedLimitValEl = document.getElementById('speedLimitVal');

    function showToast(message, duration = 3000) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    /* ==========================================================
       SPEEDOMETER & SPEED LIMIT LOGIC
       ========================================================== */
    function updateSpeed(newSpeedKmh) {
      state.currentSpeedKmh = Math.max(0, Math.round(newSpeedKmh));
      speedValEl.textContent = state.currentSpeedKmh;

      // Check Overspeed (> limit)
      if (state.currentSpeedKmh > state.speedLimitKmh) {
        speedLimitSignEl.classList.add('overspeed');
      } else {
        speedLimitSignEl.classList.remove('overspeed');
      }
    }

    function setSpeedLimit(limit) {
      if (limit && !isNaN(limit) && limit > 0) {
        state.speedLimitKmh = parseInt(limit, 10);
        speedLimitValEl.textContent = state.speedLimitKmh;
      }
      updateSpeed(state.currentSpeedKmh);
    }

    /* ==========================================================
       HEADING & COMPASS ORIENTATION (iOS & GPS)
       ========================================================== */
    function updateHeadingDisplay(headingDeg) {
      const beamEl = document.getElementById('userBeam');
      if (beamEl && headingDeg !== null && !isNaN(headingDeg)) {
        beamEl.style.display = 'block';
        beamEl.style.transform = `rotate(${headingDeg}deg)`;
      }
    }

    // Device Compass listener (especially for iOS Safari)
    function handleDeviceOrientation(e) {
      let compass = null;
      if (e.webkitCompassHeading !== undefined) {
        // iOS Safari provides exact compass heading (0 = North)
        compass = e.webkitCompassHeading;
      } else if (e.alpha !== null) {
        // Android fallback
        compass = 360 - e.alpha;
      }

      if (compass !== null) {
        state.compassHeading = compass;
        // If stopped or walking slow (< 5 km/h), prefer compass
        if (state.currentSpeedKmh < 5 || state.userHeading === null) {
          updateHeadingDisplay(compass);
        }
      }
    }

    function initCompassPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then((permissionState) => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleDeviceOrientation, true);
            }
          })
          .catch(console.warn);
      } else {
        window.addEventListener('deviceorientation', handleDeviceOrientation, true);
      }
    }

    /* ==========================================================
       GPS TRACKING (GEOLOCATION API)
       ========================================================== */
    function initGPS() {
      if (!('geolocation' in navigator)) {
        showToast('Géolocalisation non supportée');
        return;
      }

      const geoOptions = {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 10000
      };

      state.watchId = navigator.geolocation.watchPosition(
        onLocationSuccess,
        onLocationError,
        geoOptions
      );
    }

    function onLocationSuccess(pos) {
      const { latitude, longitude, accuracy, heading, speed } = pos.coords;
      const now = Date.now();
      const prevCoords = state.userCoords;

      state.userCoords = [latitude, longitude];
      state.userAccuracy = accuracy;

      // Speed calculation
      let calculatedSpeedKmh = 0;
      if (speed !== null && !isNaN(speed) && speed >= 0) {
        calculatedSpeedKmh = speed * 3.6;
      } else if (prevCoords && state.lastPosTime) {
        const dt = (now - state.lastPosTime) / 1000;
        if (dt > 0.5 && dt < 10) {
          const dMeters = calculateDistance(prevCoords[0], prevCoords[1], latitude, longitude);
          calculatedSpeedKmh = (dMeters / dt) * 3.6;
        }
      }
      state.lastPosTime = now;
      updateSpeed(calculatedSpeedKmh);

      // Heading calculation
      if (heading !== null && !isNaN(heading) && calculatedSpeedKmh >= 5) {
        state.userHeading = heading;
        updateHeadingDisplay(heading);
      } else if (state.compassHeading !== null) {
        updateHeadingDisplay(state.compassHeading);
      }

      // Create or update user position marker
      if (!userMarker) {
        userMarker = L.marker([latitude, longitude], {
          icon: userMarkerIcon,
          zIndexOffset: 1000
        }).addTo(map);

        userAccuracyCircle = L.circle([latitude, longitude], {
          radius: accuracy || 10,
          color: '#007AFF',
          weight: 1,
          opacity: 0.25,
          fillColor: '#007AFF',
          fillOpacity: 0.08
        }).addTo(map);

        map.setView([latitude, longitude], 16);
      } else {
        userMarker.setLatLng([latitude, longitude]);
        if (userAccuracyCircle) {
          userAccuracyCircle.setLatLng([latitude, longitude]);
          userAccuracyCircle.setRadius(accuracy || 10);
        }
      }

      // Auto-follow center
      if (state.isAutoFollow) {
        map.panTo([latitude, longitude], { animate: true, duration: 0.5 });
      }

      // Active route tracking & dynamic radar distance check
      if (state.destination && prevCoords) {
        const distMoved = calculateDistance(prevCoords[0], prevCoords[1], latitude, longitude);
        if (distMoved > 30) {
          calculateRoute(state.destination, false);
        }
      }

      checkUpcomingRadars(latitude, longitude);
    }

    function onLocationError(err) {
      console.warn('Geolocation error:', err.message);
      if (err.code === 1) {
        showToast('Activez la localisation pour le suivi GPS');
      } else {
        showToast('Signal GPS faible...');
      }
    }

    /* ==========================================================
       USER INTERACTIONS & AUTO-FOLLOW
       ========================================================== */
    map.on('dragstart', () => {
      state.isAutoFollow = false;
      btnRecenter.classList.remove('active');
    });

    btnRecenter.addEventListener('click', () => {
      state.isAutoFollow = true;
      btnRecenter.classList.add('active');
      if (state.userCoords) {
        map.setView(state.userCoords, Math.max(map.getZoom(), 16), { animate: true });
      } else {
        showToast('Recherche de votre position GPS...');
      }
    });

    map.on('click', (e) => {
      setDestination([e.latlng.lat, e.latlng.lng]);
    });

    function setDestination(latlng) {
      state.destination = latlng;

      if (destMarker) {
        destMarker.setLatLng(latlng);
      } else {
        destMarker = L.marker(latlng, { icon: destMarkerIcon, zIndexOffset: 900 }).addTo(map);
      }

      if (!state.userCoords) {
        showToast('En attente du signal GPS pour tracer la route...');
        return;
      }

      calculateRoute(latlng, true);
    }

    /* ==========================================================
       OSRM ROUTING & SPEED CAMERAS ON ROUTE
       ========================================================== */
    async function calculateRoute(destCoords, fitBounds = true) {
      if (!state.userCoords) return;

      const [startLat, startLon] = state.userCoords;
      const [destLat, destLon] = destCoords;

      const url = `https://router.project-osrm.org/route/v1/driving/${startLon},${startLat};${destLon},${destLat}?overview=full&geometries=geojson&steps=true`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.code !== 'Ok' || !data.routes || !data.routes.length) {
          showToast('Itinéraire introuvable');
          return;
        }

        const route = data.routes[0];
        state.activeRoute = route;

        // Leaflet coordinates: [lat, lon]
        state.routeCoordinates = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);

        // Infer road speed limit from route step or defaults
        inferSpeedLimitFromRoute(route);

        // Clear existing route layers
        if (routeBorderLayer) map.removeLayer(routeBorderLayer);
        if (routeLineLayer) map.removeLayer(routeLineLayer);

        // Outer contrast casing
        routeBorderLayer = L.polyline(state.routeCoordinates, {
          color: '#FFFFFF',
          weight: 9,
          opacity: 0.95,
          lineJoin: 'round',
          lineCap: 'round'
        }).addTo(map);

        // Distinct thick blue route line
        routeLineLayer = L.polyline(state.routeCoordinates, {
          color: '#0066FF',
          weight: 6,
          opacity: 1,
          lineJoin: 'round',
          lineCap: 'round'
        }).addTo(map);

        // Update HUD
        const distanceKm = (route.distance / 1000).toFixed(route.distance < 10000 ? 1 : 0);
        const durationMin = Math.round(route.duration / 60);

        hudDist.textContent = `${distanceKm} km`;
        if (durationMin >= 60) {
          const h = Math.floor(durationMin / 60);
          const m = durationMin % 60;
          hudTime.textContent = `${h} h ${m.toString().padStart(2, '0')} min`;
        } else {
          hudTime.textContent = `${durationMin} min`;
        }

        routeHud.classList.add('active');

        if (fitBounds) {
          const bounds = L.latLngBounds(state.routeCoordinates);
          map.fitBounds(bounds, { padding: [80, 50], maxZoom: 17 });
          state.isAutoFollow = false;
          btnRecenter.classList.remove('active');
        }

        // Fetch & display speed cameras ONLY on this active route
        fetchSpeedCamerasOnRoute(state.routeCoordinates);

      } catch (err) {
        console.error('OSRM fetch error:', err);
        showToast('Erreur lors du calcul de route');
      }
    }

    function inferSpeedLimitFromRoute(route) {
      if (route.legs && route.legs[0] && route.legs[0].steps) {
        const firstStep = route.legs[0].steps[0];
        const roadName = (firstStep.name || '').toLowerCase();
        const ref = (firstStep.ref || '').toLowerCase();

        if (ref.startsWith('a') || roadName.includes('autoroute')) {
          setSpeedLimit(130);
        } else if (ref.startsWith('n') || roadName.includes('voie rapide') || roadName.includes('rocade')) {
          setSpeedLimit(110);
        } else if (ref.startsWith('d') || roadName.includes('route')) {
          setSpeedLimit(80);
        } else {
          setSpeedLimit(50);
        }
      }
    }

    /* ==========================================================
       SPEED CAMERAS: FETCH & FILTER ON ROUTE (OVERPASS API)
       ========================================================== */
    async function fetchSpeedCamerasOnRoute(routeCoords) {
      clearRadarMarkers();

      if (!routeCoords || routeCoords.length < 2) return;

      // Compute bounding box with 0.015 margin
      let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
      for (const [lat, lon] of routeCoords) {
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
      }
      minLat -= 0.01; maxLat += 0.01;
      minLon -= 0.01; maxLon += 0.01;

      const bbox = `${minLat.toFixed(4)},${minLon.toFixed(4)},${maxLat.toFixed(4)},${maxLon.toFixed(4)}`;
      const query = `[out:json][timeout:8];(node["highway"="speed_camera"](${bbox});node["enforcement"="maxspeed"](${bbox}););out body;`;

      try {
        const endpoints = [
          'https://overpass-api.de/api/interpreter',
          'https://lz4.overpass-api.de/api/interpreter'
        ];

        let data = null;
        for (const ep of endpoints) {
          try {
            const params = new URLSearchParams();
            params.append('data', query);
            const res = await fetch(ep, {
              method: 'POST',
              body: params,
              headers: { 'User-Agent': 'WakeGPS/1.0' }
            });
            if (res.ok) {
              data = await res.json();
              break;
            }
          } catch (e) {
            console.warn('Endpoint failed:', ep, e);
          }
        }

        if (!data || !data.elements || !data.elements.length) return;

        // Filter radars strictly within 35 meters of the calculated route polyline
        state.routeRadars = [];
        for (const el of data.elements) {
          const camLat = el.lat;
          const camLon = el.lon;
          const distToRoute = minDistanceToPolyline(camLat, camLon, routeCoords);

          if (distToRoute <= 35) { // 35 meters corridor
            const speedLimit = el.tags?.maxspeed || el.tags?.['maxspeed:type'] || 'RADAR';
            state.routeRadars.push({
              lat: camLat,
              lon: camLon,
              maxspeed: speedLimit,
              id: el.id
            });

            // Create minimalist radar pin on map
            const radarIcon = L.divIcon({
              className: 'radar-marker-pin',
              html: `
                <div class="radar-badge">
                  <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                  </svg>
                  <span>${speedLimit}</span>
                </div>
              `,
              iconSize: [60, 24],
              iconAnchor: [30, 24]
            });

            const marker = L.marker([camLat, camLon], { icon: radarIcon, zIndexOffset: 950 }).addTo(map);
            state.radarMarkers.push(marker);
          }
        }

        if (state.routeRadars.length > 0) {
          showToast(`${state.routeRadars.length} radar(s) détecté(s) sur votre trajet`);
        }

      } catch (err) {
        console.warn('Speed camera fetch error:', err);
      }
    }

    function checkUpcomingRadars(userLat, userLon) {
      if (!state.routeRadars || !state.routeRadars.length) {
        hudRadarAlert.classList.remove('active');
        return;
      }

      let closestRadar = null;
      let minDistance = Infinity;

      for (const radar of state.routeRadars) {
        const d = calculateDistance(userLat, userLon, radar.lat, radar.lon);
        if (d < minDistance) {
          minDistance = d;
          closestRadar = radar;
        }
      }

      // If upcoming radar is within 600m
      if (closestRadar && minDistance <= 600) {
        hudRadarText.textContent = `Radar à ${Math.round(minDistance)}m (${closestRadar.maxspeed} km/h)`;
        hudRadarAlert.classList.add('active');

        // Set speed limit sign to the radar speed limit if numeric
        if (closestRadar.maxspeed && !isNaN(closestRadar.maxspeed)) {
          setSpeedLimit(closestRadar.maxspeed);
        }
      } else {
        hudRadarAlert.classList.remove('active');
      }
    }

    function clearRadarMarkers() {
      for (const m of state.radarMarkers) {
        map.removeLayer(m);
      }
      state.radarMarkers = [];
      state.routeRadars = [];
      hudRadarAlert.classList.remove('active');
    }

    function clearRoute() {
      state.destination = null;
      state.activeRoute = null;
      state.routeCoordinates = [];

      if (destMarker) {
        map.removeLayer(destMarker);
        destMarker = null;
      }
      if (routeBorderLayer) {
        map.removeLayer(routeBorderLayer);
        routeBorderLayer = null;
      }
      if (routeLineLayer) {
        map.removeLayer(routeLineLayer);
        routeLineLayer = null;
      }

      clearRadarMarkers();
      routeHud.classList.remove('active');
      searchInput.value = '';
      searchResults.classList.remove('active');
      searchResults.innerHTML = '';
      setSpeedLimit(50);
    }

    btnClearRoute.addEventListener('click', clearRoute);

    /* ==========================================================
       GEOMETRIC UTILITY: POINT-TO-POLYLINE DISTANCE
       ========================================================== */
    function minDistanceToPolyline(pLat, pLon, polyCoords) {
      let minDist = Infinity;
      for (let i = 0; i < polyCoords.length - 1; i++) {
        const [aLat, aLon] = polyCoords[i];
        const [bLat, bLon] = polyCoords[i + 1];
        const dist = distToSegment(pLat, pLon, aLat, aLon, bLat, bLon);
        if (dist < minDist) minDist = dist;
      }
      return minDist;
    }

    function distToSegment(pLat, pLon, aLat, aLon, bLat, bLon) {
      // Approximate flat coordinate projection in meters for fast distance
      const x = (pLon - aLon) * Math.cos((aLat + bLat) * Math.PI / 360) * 111320;
      const y = (pLat - aLat) * 110540;
      const dx = (bLon - aLon) * Math.cos((aLat + bLat) * Math.PI / 360) * 111320;
      const dy = (bLat - aLat) * 110540;

      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return Math.sqrt(x * x + y * y);

      let t = (x * dx + y * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));

      const projX = t * dx;
      const projY = t * dy;
      return Math.sqrt((x - projX) * (x - projX) + (y - projY) * (y - projY));
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    /* ==========================================================
       NOMINATIM SEARCH
       ========================================================== */
    let searchDebounce = null;

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim();
      clearTimeout(searchDebounce);

      if (q.length < 3) {
        searchResults.classList.remove('active');
        searchResults.innerHTML = '';
        return;
      }

      searchDebounce = setTimeout(async () => {
        try {
          let viewboxParam = '';
          if (state.userCoords) {
            const [lat, lon] = state.userCoords;
            viewboxParam = `&viewbox=${lon-1},${lat+1},${lon+1},${lat-1}`;
          }

          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}${viewboxParam}&limit=4&addressdetails=1`);
          const places = await res.json();

          if (!places.length) {
            searchResults.innerHTML = '<div class="search-item" style="color:#8E8E93;">Aucun résultat trouvé</div>';
            searchResults.classList.add('active');
            return;
          }

          searchResults.innerHTML = places.map(p => `
            <div class="search-item" data-lat="${p.lat}" data-lon="${p.lon}">
              <strong>${escapeHtml(p.name || p.display_name.split(',')[0])}</strong><br/>
              <span style="font-size:12px; color:#8E8E93;">${escapeHtml(p.display_name)}</span>
            </div>
          `).join('');

          searchResults.classList.add('active');
        } catch (err) {
          console.error('Search error:', err);
        }
      }, 350);
    });

    searchResults.addEventListener('click', (e) => {
      const item = e.target.closest('.search-item');
      if (!item || !item.dataset.lat) return;

      const lat = parseFloat(item.dataset.lat);
      const lon = parseFloat(item.dataset.lon);

      searchInput.value = item.querySelector('strong').textContent;
      searchResults.classList.remove('active');
      searchResults.innerHTML = '';

      setDestination([lat, lon]);
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    /* ==========================================================
       WAKE LOCK API & INTERACTION TRIGGERS
       ========================================================== */
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          state.wakeLock = await navigator.wakeLock.request('screen');
          state.wakeLock.addEventListener('release', () => {
            state.wakeLock = null;
          });
        } catch (err) {
          console.warn('Wake Lock error:', err.message);
        }
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // Request compass and wake lock on first touch/click
    window.addEventListener('click', () => {
      if (!state.wakeLock) requestWakeLock();
      initCompassPermission();
    }, { once: true });

    /* ==========================================================
       PWA SERVICE WORKER REGISTRATION
       ========================================================== */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('ServiceWorker registered:', reg.scope))
          .catch((err) => console.warn('ServiceWorker registration failed:', err));
      });
    }

    // Start GPS immediately
    initGPS();
  </script>
</body>
</html>
